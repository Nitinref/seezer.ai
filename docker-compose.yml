services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    healthcheck:
      # Node is already in the image, so this does not add curl/wget just for
      # a health probe. It also verifies that Redis/BullMQ is reachable.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
